<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>留言板</title>
    <style>
        body { max-width: 900px; margin: 50px auto; background: #f5f5f5; }
        .box { background: #fff; padding: 30px; border-radius: 10px; }
        h1 { text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h1>欢迎留言</h1>
        <div id="twikoo"></div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/twikoo/dist/twikoo.all.min.js"></script>
<script>
// 唯一正确配置！Vercel专用 + 后缀 /twikoo
twikoo.init({
  el: "#twikoo",
  envId: "https://vercel-blog-two-alpha.vercel.app/twikoo"
});
</script>
</body>
</html>
